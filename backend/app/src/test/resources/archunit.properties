# 「should 匹配到 0 个类」一律判为失败。
#
# 阶段 0 曾把它全局关成 false：那时 15 个领域模块只有 package-info.java，AR-1／AR-3／AR-4
# 三条以模块包为 that() 条件的断言匹配不到任何类。代价是**所有**断言都失去了空集保护——
# 只要类导入出了岔子（比如 importClasses 漏扫 jar），十几条断言会一起变成绿色的空转。
#
# 1B 起 platform 三个模块有了真实类，因此改回 true，把例外收敛成 ArchitectureRulesTest 里
# 逐条标注的 allowEmptyShould(true)：例外写在断言旁边，才能在业务模块落地时被顺手删掉。
archRule.failOnEmptyShould=true
