# 生产环境（内网单台台式机，64G 内存 + 2T 磁盘，决策 C13 / BLOCK-03）。
#
# 规则 CF（配置与敏感信息）：口令、数据库密码一律从环境变量注入，不写进代码库。
# 环境变量在服务器上的 .env 文件里维护，该文件不进 git（见 .gitignore）。

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:aiacademy}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 单实例 + 100 人以内使用者，连接池不需要大
      maximum-pool-size: 20
      minimum-idle: 5

aiacademy:
  accounts:
    operator:
      password-hash: ${OPERATOR_PASSWORD_HASH}
    viewer:
      password-hash: ${VIEWER_PASSWORD_HASH}

logging:
  level:
    root: INFO
    com.aiacademy: INFO
  file:
    name: /var/log/aiacademy/app.log
