# 版本的唯一权威来源。对应《开发实施文档》3.6 选型汇总表。
# 纪律：新增依赖前先查 CLAUDE.md 第二节技术栈表；同一件事只允许一个库。

[versions]
springBoot = "3.2.11"
mybatisPlus = "3.5.7"
postgresql = "42.7.4"
flyway = "10.20.1"
easyexcel = "3.3.4"
springdoc = "2.3.0"
archunit = "1.3.0"
# 嵌入式 PostgreSQL：把官方 PG 二进制打进 jar，启动时解包直接跑。
# 内网机器装不了 Docker，而本项目的 SQL 深度依赖 PG 专有能力（三色灯是 plpgsql 存储函数、
# 79 个部分索引、GIN + pg_trgm、132 处 TIMESTAMPTZ），换 SQLite 等于重写数据层。
# 这条路保留的是「同一个 PostgreSQL」，一行 SQL 都不用改。
zonkyEmbeddedPostgres = "2.1.0"
# 二进制版本独立于上面的库版本，必须与生产的 PG 15 对齐（docker-compose 里是 postgres:15）
zonkyPostgresBinaries = "15.19.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-web = { module = "org.springframework:spring-web" }
spring-context = { module = "org.springframework:spring-context" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
# JSONB 多选列的读写（精品标注、评审形式、验收标准勾选、案例应用领域……）。
# 手写 JSON 拼接在单处是安全的，散到五个模块之后就不是了
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
# 平台模块里的表单只需要注解本身，校验的执行由 app 的 starter-validation 提供
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }

mybatis-plus = { module = "com.baomidou:mybatis-plus-spring-boot3-starter", version.ref = "mybatisPlus" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
easyexcel = { module = "com.alibaba:easyexcel", version.ref = "easyexcel" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# 嵌入式 PostgreSQL。二进制按平台分成独立构件，且 embedded-postgres 默认只带 linux-amd64，
# Windows 必须显式声明，否则在 Windows 上启动时才报「找不到二进制」——那是运行期而不是构建期。
zonky-embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "zonkyEmbeddedPostgres" }
zonky-postgres-binaries-bom = { module = "io.zonky.test.postgres:embedded-postgres-binaries-bom", version.ref = "zonkyPostgresBinaries" }
zonky-postgres-binaries-windows = { module = "io.zonky.test.postgres:embedded-postgres-binaries-windows-amd64" }
zonky-postgres-binaries-linux = { module = "io.zonky.test.postgres:embedded-postgres-binaries-linux-amd64" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
