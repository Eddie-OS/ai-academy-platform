# sun.jnu.encoding 必须显式指定：仓库路径含中文时，Gradle 写给测试进程的 classpath
# 会按系统 ANSI 代码页编码，导致测试进程加载不到类（ClassNotFoundException）。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 本机可能只装了 JDK 8（见 README「工具链」一节）。开启工具链自动下载后，
# Gradle 会自行获取 JDK 17，不需要手工安装。若构建机无外网，请手工安装 JDK 17 并关闭此项。
org.gradle.java.installations.auto-download=true
